name: Release

# Builds installers when a version tag such as v0.1.0 is pushed, and attaches them to a
# draft GitHub release. The maintainer reviews the draft and publishes it by hand.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add DuckDB's Intel binding for the Intel Mac build
        if: runner.os == 'macOS'
        run: node scripts/add-duckdb-binding.mjs darwin-x64
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Installers are unsigned in v0.1 (see README).
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release with installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "Super Ontology $GITHUB_REF_NAME" \
            --notes "Unsigned installers for Windows (NSIS), macOS (dmg, Apple silicon and Intel) and Linux (AppImage). See the README for the Windows SmartScreen and macOS Gatekeeper warnings."
