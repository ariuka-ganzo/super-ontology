name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # DuckDB's database connectors, which ship inside the app. Tests fail rather than skip without them.
      - run: node scripts/fetch-duckdb-extensions.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          REQUIRE_DB_CONNECTORS: '1'

  databases:
    # Imports from real PostgreSQL and MySQL servers. Service containers only run on Linux runners.
    name: Database servers (PostgreSQL, MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: shop
        ports: ['3306:3306']
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -proot" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-duckdb-extensions.mjs
      - run: npx vitest run tests/unit/databases.test.ts
        env:
          REQUIRE_DB_CONNECTORS: '1'
          ONTOLOGY_TEST_POSTGRES: '1'
          ONTOLOGY_TEST_MYSQL: '1'

  e2e:
    name: End-to-end tests (Linux, xvfb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-duckdb-extensions.mjs
      - run: npm run build
      - run: xvfb-run -a npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  package:
    # Builds the app and installer with electron-builder, then checks that the packaged app can load
    # the DuckDB native binary from outside the asar archive, and runs the end-to-end tests on it.
    name: Package and smoke test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            extensions: win-x64
          - os: macos-latest
            target: --mac
            extensions: mac-arm64 mac-x64
          - os: ubuntu-latest
            target: --linux
            extensions: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Add DuckDB's Intel binding for the Intel Mac build
        if: runner.os == 'macOS'
        run: node scripts/add-duckdb-binding.mjs darwin-x64
      - run: node scripts/fetch-duckdb-extensions.mjs ${{ matrix.extensions }}
      - run: npm run build
      # Builds the installer (NSIS, dmg or AppImage) as well as the unpacked app it is made from,
      # so installer configuration is checked on every pull request, not only at release time.
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Resolve-Path "release/win-unpacked/Super Ontology.exe"
          $env:ONTOLOGY_SMOKE_OUT = "$env:RUNNER_TEMP\smoke.txt"
          $env:ONTOLOGY_USER_DATA = "$env:RUNNER_TEMP\userdata"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          Get-Content $env:ONTOLOGY_SMOKE_OUT
          if ($p.ExitCode -ne 0) { throw "smoke test exited with $($p.ExitCode)" }
          if (-not (Select-String -Path $env:ONTOLOGY_SMOKE_OUT -Pattern "ONTOLOGY_SMOKE_OK" -Quiet)) { throw "smoke test failed" }
          Get-ChildItem -Recurse "release/win-unpacked/resources/app.asar.unpacked/node_modules/@duckdb" -Include *.node,*.dll | Select-Object FullName
          echo "ONTOLOGY_E2E_EXECUTABLE=$exe" >> $env:GITHUB_ENV

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          exe="$PWD/release/mac-arm64/Super Ontology.app/Contents/MacOS/Super Ontology"
          ONTOLOGY_SMOKE_OUT="$RUNNER_TEMP/smoke.txt" ONTOLOGY_USER_DATA="$RUNNER_TEMP/userdata" "$exe" --smoke-test
          cat "$RUNNER_TEMP/smoke.txt"
          grep -q ONTOLOGY_SMOKE_OK "$RUNNER_TEMP/smoke.txt"
          # The Intel app, run under Rosetta 2.
          x64="$PWD/release/mac/Super Ontology.app/Contents/MacOS/Super Ontology"
          file "$x64" | grep -q x86_64
          ONTOLOGY_SMOKE_OUT="$RUNNER_TEMP/smoke-x64.txt" ONTOLOGY_USER_DATA="$RUNNER_TEMP/userdata-x64" arch -x86_64 "$x64" --smoke-test
          cat "$RUNNER_TEMP/smoke-x64.txt"
          grep -q ONTOLOGY_SMOKE_OK "$RUNNER_TEMP/smoke-x64.txt"
          ls release/*.dmg
          find release -path "*app.asar.unpacked*" -name "*.node"
          echo "ONTOLOGY_E2E_EXECUTABLE=$exe" >> "$GITHUB_ENV"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          ONTOLOGY_SMOKE_OUT="$RUNNER_TEMP/smoke.txt" ONTOLOGY_USER_DATA="$RUNNER_TEMP/userdata" xvfb-run -a release/linux-unpacked/super-ontology --smoke-test --no-sandbox
          cat "$RUNNER_TEMP/smoke.txt"
          grep -q ONTOLOGY_SMOKE_OK "$RUNNER_TEMP/smoke.txt"
          echo "ONTOLOGY_E2E_EXECUTABLE=$PWD/release/linux-unpacked/super-ontology" >> "$GITHUB_ENV"

      - name: End-to-end tests on the packaged app (Windows, macOS)
        if: runner.os != 'Linux'
        run: npx playwright test

      - name: End-to-end tests on the packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packaged-e2e-${{ runner.os }}
          path: test-results/
          retention-days: 7

      - name: Upload unsigned installer for manual testing
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 7
